<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h3>Sign In</h3>
      <p>Enter your credentials to access your account</p>
    </div>
    <div class="auth-body">
      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <mat-form-field class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email">
            <mat-error *ngIf="loginForm.get('email').hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="loginForm.get('email').hasError('email')">Enter a valid email</mat-error>
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password">
            <mat-error *ngIf="loginForm.get('password').hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="loginForm.get('password').hasError('minlength')">Password must be at least 6 characters</mat-error>
          </mat-form-field>
        </div>
        <button mat-raised-button type="submit" class="btn btn-danger btn-block btn-lg" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>
        </button>
      </form>
    </div>
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
